<style>
:root{
  --bg:#12151a;
  --surface:#1a1e25;
  --surface-2:#20242c;
  --border:#2a2f3a;
  --text:#e7e9ec;
  --muted:#8a92a3;
  --faint:#5c6472;
  --accent:#5b8def;
  --accent-dim:rgba(91,141,239,.14);
  --ok:#4caf7d;
  --ok-dim:rgba(76,175,125,.14);
  --err:#e2645c;
  --err-dim:rgba(226,100,92,.12);
  --shadow:0 10px 35px rgba(0,0,0,.18);
  font-size:16px;
}

@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8;
    --surface:#fff;
    --surface-2:#fbfbfc;
    --border:#e1e4e9;
    --text:#1a1d22;
    --muted:#656d7c;
    --faint:#9aa1ad;
    --accent:#3568d4;
    --accent-dim:rgba(53,104,212,.08);
    --ok:#2b8a5d;
    --ok-dim:rgba(43,138,93,.08);
    --err:#c0433c;
    --err-dim:rgba(192,67,60,.08);
    --shadow:0 10px 30px rgba(20,30,50,.08);
  }
}

:root[data-theme="light"]{
  --bg:#f5f6f8;
  --surface:#fff;
  --surface-2:#fbfbfc;
  --border:#e1e4e9;
  --text:#1a1d22;
  --muted:#656d7c;
  --faint:#9aa1ad;
  --accent:#3568d4;
  --accent-dim:rgba(53,104,212,.08);
  --ok:#2b8a5d;
  --ok-dim:rgba(43,138,93,.08);
  --err:#c0433c;
  --err-dim:rgba(192,67,60,.08);
  --shadow:0 10px 30px rgba(20,30,50,.08);
}

*{box-sizing:border-box}

html{
  margin:0;
  background:var(--bg);
  color:var(--text);
  transition:background .35s ease,color .35s ease;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,var(--accent-dim),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
  transition:background .4s ease,color .35s ease;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.035;
  background-image:
    linear-gradient(var(--text) 1px,transparent 1px),
    linear-gradient(90deg,var(--text) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom,black,transparent 75%);
}

.mono{font-family:'IBM Plex Mono',monospace}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.wrap{
  width:100%;
  max-width:960px;
  margin:0 auto;
  padding-left:20px;
  padding-right:20px;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  transition:background .35s ease,border-color .35s ease;
}

.header-row{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding-top:8px;
  padding-bottom:8px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  flex:1 1 auto;
  overflow:hidden;
  animation:brandIn .8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes brandIn{
  from{opacity:0;transform:translateX(-18px)}
  to{opacity:1;transform:translateX(0)}
}

.brand-logo{
  width:62px;
  height:62px;
  object-fit:contain;
  display:block;
  flex:0 0 62px;
  filter:drop-shadow(0 0 0 transparent);
  animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .35s ease,filter .35s ease;
}

.brand:hover .brand-logo{
  transform:rotate(-3deg) scale(1.07);
  filter:drop-shadow(0 0 12px var(--accent-dim));
}

@keyframes logoIn{
  from{opacity:0;transform:scale(.7) rotate(-8deg)}
  to{opacity:1;transform:scale(1) rotate(0)}
}

.brand-text{
  display:flex;
  align-items:baseline;
  gap:9px;
  min-width:0;
  overflow:hidden;
}

.brand .name{
  font-weight:700;
  font-size:clamp(19px,3vw,27px);
  letter-spacing:-.3px;
  white-space:nowrap;
}

.brand .tag{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.theme-btn{
  flex:0 0 auto;
  min-width:94px;
  height:36px;
  padding:0 12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
  font-family:inherit;
  white-space:nowrap;
  transition:
    color .2s ease,
    border-color .2s ease,
    background .2s ease,
    transform .15s ease,
    box-shadow .25s ease;
}

.theme-btn:hover{
  color:var(--text);
  border-color:var(--faint);
  box-shadow:0 5px 18px rgba(0,0,0,.12);
  transform:translateY(-1px);
}

.theme-btn:active{transform:scale(.96)}

/* ================= MAIN ================= */

main{
  padding-top:28px;
  padding-bottom:60px;
}

.search-card{
  position:relative;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:28px;
  box-shadow:var(--shadow);
  animation:cardIn .7s .08s cubic-bezier(.2,.8,.2,1) both;
  transition:
    transform .3s ease,
    box-shadow .3s ease,
    border-color .3s ease,
    background .35s ease;
}

.search-card::before{
  content:"";
  position:absolute;
  left:-30%;
  top:0;
  width:35%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:scanline 4s ease-in-out infinite;
}

.search-card:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 45px rgba(0,0,0,.22);
}

@keyframes scanline{
  0%{left:-35%;opacity:0}
  15%{opacity:1}
  45%{left:105%;opacity:0}
  100%{left:105%;opacity:0}
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(18px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.search-card h1{
  font-size:19px;
  margin:0 0 4px;
  font-weight:600;
}

.search-card p.sub{
  margin:0 0 16px;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.5;
  max-width:60ch;
}

form{
  display:flex;
  gap:10px;
}

input[type="text"]{
  flex:1 1 auto;
  width:100%;
  min-width:0;
  height:44px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:8px;
  padding:0 14px;
  font-size:14.5px;
  font-family:'IBM Plex Mono',monospace;
  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    background .25s ease,
    transform .2s ease;
}

input[type="text"]:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim),0 5px 20px var(--accent-dim);
  transform:translateY(-1px);
}

input[type="text"]::placeholder{
  color:var(--faint);
  font-family:'IBM Plex Sans',sans-serif;
}

button[type="submit"]{
  flex:0 0 auto;
  height:44px;
  min-width:92px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:0 20px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
  white-space:nowrap;
  position:relative;
  overflow:hidden;
  transition:
    transform .15s ease,
    filter .2s ease,
    box-shadow .25s ease;
}

button[type="submit"]::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  transform:skewX(-20deg);
}

button[type="submit"]:hover{
  filter:brightness(1.08);
  transform:translateY(-2px);
  box-shadow:0 8px 22px var(--accent-dim);
}

button[type="submit"]:hover::after{
  animation:buttonShine .65s ease;
}

button[type="submit"]:active{
  transform:scale(.96);
}

button[type="submit"]:disabled{
  opacity:.55;
  cursor:default;
  transform:none;
}

@keyframes buttonShine{
  from{left:-100%}
  to{left:140%}
}

/* ================= PROGRESS ================= */

.progress{
  margin-top:16px;
  display:none;
}

.progress.active{
  display:block;
  animation:fadeUp .3s ease both;
}

.progress-line{
  display:flex;
  justify-content:space-between;
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:6px;
}

.progress-track{
  height:4px;
  background:var(--surface-2);
  border-radius:3px;
  overflow:hidden;
  position:relative;
}

.progress-fill{
  height:100%;
  background:var(--accent);
  width:0%;
  border-radius:3px;
  transition:width .3s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 12px var(--accent);
  position:relative;
}

.progress-fill::after{
  content:"";
  position:absolute;
  right:0;
  top:-3px;
  width:8px;
  height:10px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px 3px var(--accent);
  animation:pulseDot .8s ease-in-out infinite alternate;
}

@keyframes pulseDot{
  from{opacity:.45;transform:scale(.8)}
  to{opacity:1;transform:scale(1.2)}
}

/* ================= SUMMARY ================= */

.summary{
  display:none;
  align-items:center;
  gap:18px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:18px;
  flex-wrap:wrap;
  animation:fadeUp .4s ease both;
}

.summary.active{display:flex}

.summary b{
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
}

.summary .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
}

.summary .dot:first-child{
  animation:dotPulse 1.8s ease-in-out infinite;
}

@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.5);opacity:.6}
}

.summary .copy-btn{
  margin-left:auto;
  min-height:32px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  border-radius:7px;
  padding:6px 12px;
  font-size:12.5px;
  cursor:pointer;
  font-family:inherit;
  transition:all .2s ease;
}

.summary .copy-btn:hover{
  color:var(--text);
  border-color:var(--faint);
  transform:translateY(-1px);
}

/* ================= GROUPS ================= */

section.group{margin-bottom:30px}

.group-title{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin:0 0 12px;
  animation:fadeUp .35s ease both;
}

.empty{
  border:1px dashed var(--border);
  border-radius:12px;
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.6;
  animation:emptyIn .55s cubic-bezier(.2,.8,.2,1) both;
  transition:border-color .3s ease,background .3s ease;
}

.empty:hover{
  border-color:var(--faint);
  background:var(--surface);
}

.empty b{
  color:var(--text);
  display:block;
  margin-bottom:4px;
  font-size:14.5px;
}

@keyframes emptyIn{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}

/* ================= RESULTS ================= */

.hits{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));
  gap:12px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--ok);
  border-radius:10px;
  padding:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  animation:resultIn .5s cubic-bezier(.2,.8,.2,1) both;
  transition:
    transform .3s cubic-bezier(.2,.8,.2,1),
    box-shadow .3s ease,
    border-color .25s ease;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 35px rgba(0,0,0,.18);
  border-color:var(--faint);
  border-left-color:var(--ok);
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:translateY(18px) scale(.97);
    filter:blur(2px);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.card-id{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:0;
}

.avatar,
.avatar-fallback{
  width:34px;
  height:34px;
  border-radius:8px;
  flex-shrink:0;
  background:var(--surface-2);
  border:1px solid var(--border);
}

.avatar{
  object-fit:cover;
  transition:transform .3s ease,box-shadow .3s ease;
}

.card:hover .avatar{
  transform:scale(1.1) rotate(2deg);
  box-shadow:0 5px 15px rgba(0,0,0,.18);
}

.avatar-fallback{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  color:var(--muted);
}

.card-src{
  min-width:0;
}

.card-src .name{
  font-weight:600;
  font-size:13.5px;
}

.card-src .cat{
  font-size:11.5px;
  color:var(--muted);
}

.inspect-btn{
  border:1px solid var(--border);
  background:transparent;
  color:var(--faint);
  border-radius:6px;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:all .2s ease;
}

.inspect-btn:hover{
  color:var(--text);
  border-color:var(--faint);
  transform:rotate(90deg);
}

.card-title{
  font-size:14.5px;
  font-weight:600;
  margin-bottom:1px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.card-handle{
  font-size:12.5px;
  color:var(--accent);
  font-family:'IBM Plex Mono',monospace;
  margin-bottom:10px;
}

.card-bio{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.55;
  margin-bottom:10px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:10px;
}

.badge{
  font-size:10.5px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--muted);
  padding:2px 7px;
  border-radius:5px;
  font-family:'IBM Plex Mono',monospace;
  transition:transform .2s ease,border-color .2s ease;
}

.badge:hover{
  transform:translateY(-2px);
  border-color:var(--faint);
}

.metrics{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:6px;
  margin-bottom:10px;
}

.metric{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:7px;
  padding:6px 8px;
  text-align:center;
  transition:
    transform .25s ease,
    border-color .25s ease,
    background .25s ease;
}

.metric:hover{
  transform:translateY(-3px);
  border-color:var(--faint);
}

.metric .v{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:600;
}

.metric .l{
  font-size:9.5px;
  color:var(--faint);
  margin-top:1px;
}

.clublist{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:10px;
}

.clublist a{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  color:var(--text);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:4px 7px;
  transition:transform .2s ease,border-color .2s ease;
}

.clublist a:hover{
  text-decoration:none;
  transform:translateX(4px);
  border-color:var(--faint);
}

.clublist img{
  width:16px;
  height:16px;
  border-radius:4px;
}

.card-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:10px;
  border-top:1px solid var(--border);
}

.card-foot .open{
  font-size:12px;
  font-weight:600;
  transition:transform .2s ease;
}

.card-foot .open:hover{
  transform:translateX(3px);
}

.card-foot .id{
  font-size:11px;
  color:var(--faint);
  font-family:'IBM Plex Mono',monospace;
}

/* ================= MISSES ================= */

details.misses{
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--surface);
  animation:fadeUp .45s ease both;
}

details.misses summary{
  list-style:none;
  cursor:pointer;
  padding:12px 16px;
  font-size:13px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  transition:background .2s ease,color .2s ease;
}

details.misses summary:hover{
  background:var(--surface-2);
  color:var(--text);
}

details.misses summary::-webkit-details-marker{display:none}

details.misses summary .chev{
  transition:transform .25s ease;
  color:var(--faint);
}

details.misses[open] summary .chev{
  transform:rotate(90deg);
}

.miss-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 16px;
  font-size:12.5px;
  border-top:1px solid var(--border);
  animation:rowIn .3s ease both;
}

.miss-row .n{color:var(--muted)}

.miss-row .s{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:1px 6px;
  border-radius:4px;
}

.miss-row .s.nf{
  color:var(--faint);
  background:var(--surface-2);
}

.miss-row .s.er{
  color:var(--err);
  background:var(--err-dim);
}

@keyframes rowIn{
  from{opacity:0;transform:translateX(-5px)}
  to{opacity:1;transform:translateX(0)}
}

/* ================= MODAL ================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal-bg.open{
  display:flex;
  animation:modalBgIn .25s ease both;
}

.modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  max-width:640px;
  width:100%;
  max-height:80vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
  animation:modalIn .35s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes modalBgIn{

<script>

/* ========================= TARGET ENDPOINTS ========================= */

const TARGET_ENDPOINTS = [

  {
    id:'pronouns_page',
    name:'Pronouns.page',
    category:'Identity',

    fetch:async user =>
      fetchUrl(
        `https://en.pronouns.page/api/public/v3/users/${encodeURIComponent(user)}`
      ),

    parse:data=>{

      if(!data || !data.profiles)
        return null;

      const en =
        data.profiles.en ||
        Object.values(data.profiles)[0];

      if(!en)
        return null;

      const names =
        (en.names || [])
          .map(n =>
            typeof n === 'string'
              ? n
              : n.value || n.name
          )
          .filter(Boolean);

      const pronouns =
        (en.pronouns || [])
          .map(p =>
            typeof p === 'string'
              ? p
              : p.value || p.pronoun
          )
          .filter(Boolean);

      const links =
        (en.links || [])
          .map(l =>
            typeof l === 'string'
              ? l
              : l.href || l.link
          )
          .filter(Boolean);

      return {

        avatar:data.avatar || null,

        title:
          names[0] ||
          data.username,

        handle:
          `@${data.username}`,

        bio:
          en.bio || '',

        badges:
          pronouns,

        metrics:[
          {
            l:'Names',
            v:names.length
          },
          {
            l:'Pronouns',
            v:pronouns.length
          }
        ],

        links,

        profileUrl:
          `https://pronouns.page/@${data.username}`

      };

    }

  },

  {
    id:'chess_com',
    name:'Chess.com',
    category:'Gaming',

    fetch:async user=>{

      const base =
        `https://api.chess.com/pub/player/${encodeURIComponent(user)}`;

      const profileRes =
        await fetchUrl(base);

      if(profileRes.status !== 200)
        return profileRes;

      const [
        statsRes,
        clubsRes
      ] =
        await Promise.allSettled([

          fetchUrl(`${base}/stats`),

          fetchUrl(`${base}/clubs`)

        ]);

      return {

        status:200,

        data:{

          profile:
            profileRes.data,

          stats:
            statsRes.status === 'fulfilled' &&
            statsRes.value.status === 200
              ? statsRes.value.data
              : null,

          clubs:
            clubsRes.status === 'fulfilled' &&
            clubsRes.value.status === 200
              ? clubsRes.value.data.clubs
              : []

        }

      };

    },

    parse:payload=>{

      if(
        !payload ||
        !payload.profile ||
        !payload.profile.username
      )
        return null;

      const p =
        payload.profile;

      const s =
        payload.stats || {};

      const clubs =
        payload.clubs || [];

      return {

        avatar:p.avatar,

        title:
          p.name ||
          p.username,

        handle:
          `@${p.username}`,

        bio:
          `Joined ${new Date(p.joined*1000).toLocaleDateString()} · last online ${new Date(p.last_online*1000).toLocaleDateString()}`,

        badges:[
          p.title
            ? `Title: ${p.title}`
            : null,

          p.location

        ].filter(Boolean),

        metrics:[

          {
            l:'Blitz',
            v:
              s.chess_blitz
                ? s.chess_blitz.last.rating
                : '—'
          },

          {
            l:'Rapid',
            v:
              s.chess_rapid
                ? s.chess_rapid.last.rating
                : '—'
          },

          {
            l:'Bullet',
            v:
              s.chess_bullet
                ? s.chess_bullet.last.rating
                : '—'
          },

          {
            l:'Followers',
            v:p.followers
          }

        ],

        clubs:
          clubs
            .slice(0,4)
            .map(c=>({

              name:c.name,
              icon:c.icon,
              url:c.url

            })),

        links:[
          p.url
        ],

        profileUrl:
          p.url

      };

    }

  },

  {
    id:'lichess',
    name:'Lichess',
    category:'Gaming',

    fetch:async user =>
      fetchUrl(
        `https://lichess.org/api/user/${encodeURIComponent(user)}`
      ),

    parse:data=>{

      if(
        !data ||
        data.error ||
        !data.id
      )
        return null;

      const perf =
        data.perfs || {};

      return {

        avatar:null,

        title:
          data.username,

        handle:
          data.title
            ? `[${data.title}] @${data.id}`
            : `@${data.id}`,

        bio:
          data.bio || '',

        badges:[
          data.online
            ? 'Online'
            : 'Offline',

          data.patron
            ? 'Patron'
            : null

        ].filter(Boolean),

        metrics:[

          {
            l:'Blitz',
            v:
              perf.blitz
                ? perf.blitz.rating
                : '—'
          },

          {
            l:'Rapid',
            v:
              perf.rapid
                ? perf.rapid.rating
                : '—'
          },

          {
            l:'Puzzles',
            v:
              perf.puzzle
                ? perf.puzzle.rating
                : '—'
          },

          {
            l:'Games',
            v:
              data.count
                ? data.count.all
                : 0
          }

        ],

        links:[
          data.url
        ],

        profileUrl:
          data.url ||
          `https://lichess.org/@/${data.username}`

      };

    }

  },

  {
    id:'github',
    name:'GitHub',
    category:'Developer',

    fetch:async user =>
      fetchUrl(
        `https://api.github.com/users/${encodeURIComponent(user)}`
      ),

    parse:data=>{

      if(
        !data ||
        data.message === 'Not Found' ||
        !data.login
      )
        return null;

      return {

        avatar:
          data.avatar_url,

        title:
          data.name ||
          data.login,

        handle:
          `@${data.login}`,

        bio:
          data.bio || '',

        badges:[
          data.company,
          data.location
        ].filter(Boolean),

        metrics:[

          {
            l:'Repos',
            v:data.public_repos
          },

          {
            l:'Followers',
            v:data.followers
          },

          {
            l:'Gists',
            v:data.public_gists
          }

        ],

        links:
          data.blog
            ? [
                data.blog.startsWith('http')
                  ? data.blog
                  : `https://${data.blog}`
              ]
            : [],

        profileUrl:
          data.html_url

      };

    }

  },

  {
    id:'gravatar',
    name:'Gravatar',
    category:'Identity',

    fetch:async user =>
      fetchUrl(
        `https://en.gravatar.com/${encodeURIComponent(user)}.json`
      ),

    parse:data=>{

      if(
        !data ||
        !data.entry ||
        !data.entry[0]
      )
        return null;

      const e =
        data.entry[0];

      const urls =
        (e.urls || [])
          .map(u=>u.value);

      return {

        avatar:
          e.thumbnailUrl,

        title:
          e.displayName ||
          e.preferredUsername,

        handle:
          `@${e.preferredUsername}`,

        bio:
          e.aboutMe || '',

        badges:[
          e.currentLocation
        ].filter(Boolean),

        metrics:[

          {
            l:'Accounts',
            v:
              e.accounts
                ? e.accounts.length
                : 0
          },

          {
            l:'URLs',
            v:urls.length
          }

        ],

        links:
          urls,

        profileUrl:
          e.profileUrl ||
          `https://gravatar.com/${e.preferredUsername}`

      };

    }

  },

  {
    id:'keybase',
    name:'Keybase',
    category:'Security',

    fetch:async user =>
      fetchUrl(
        `https://keybase.io/_/api/1.0/user/lookup.json?usernames=${encodeURIComponent(user)}`
      ),

    parse:data=>{

      if(
        !data ||
        !data.them ||
        !data.them[0]
      )
        return null;

      const u =
        data.them[0];

      if(!u.id)
        return null;

      const proofs =
        (
          u.proofs_summary
            ? u.proofs_summary.all || []
            : []
        )
        .map(
          p =>
            `${p.proof_type}: ${p.nametag}`
        );

      return {

        avatar:
          u.pictures &&
          u.pictures.primary
            ? u.pictures.primary.url
            : null,

        title:
          u.profile
            ? u.profile.full_name ||
              u.basics.username
            : u.basics.username,

        handle:
          `@${u.basics.username}`,

        bio:
          u.profile
            ? u.profile.bio
            : '',

        badges:
          proofs.slice(0,4),

        metrics:[

          {
            l:'Proofs',
            v:proofs.length
          },

          {
            l:'Devices',
            v:
              u.devices
                ? Object.keys(u.devices).length
                : 0
          }

        ],

        links:[],

        profileUrl:
          `https://keybase.io/${u.basics.username}`

      };

    }

  },

  {
    id:'reddit',
    name:'Reddit',
    category:'Social',

    fetch:async user =>
      fetchUrl(
        `https://www.reddit.com/user/${encodeURIComponent(user)}/about.json`
      ),

    parse:data=>{

      if(
        !data ||
        !data.data ||
        data.error === 404
      )
        return null;

      const u =
        data.data;

      return {

        avatar:
          u.icon_img
            ? u.icon_img.split('?')[0]
            : null,

        title:
          u.subreddit
            ? u.subreddit.title ||
              u.name
            : u.name,

        handle:
          `u/${u.name}`,

        bio:
          u.subreddit
            ? u.subreddit.public_description
            : '',

        badges:[

          u.is_gold
            ? 'Gold'
            : null,

          u.is_mod
            ? 'Moderator'
            : null,

          u.has_verified_email
            ? 'Verified email'
            : null

        ].filter(Boolean),

        metrics:[

          {
            l:'Post karma',
            v:u.link_karma
          },

          {
            l:'Comment karma',
            v:u.comment_karma
          },

          {
            l:'Since',
            v:
              new Date(
                u.created_utc*1000
              ).getFullYear()
          }

        ],

        links:[],

        profileUrl:
          `https://reddit.com/user/${u.name}`

      };

    }

  },

  {
    id:'pronouns_cc',
    name:'Pronouns.cc',
    category:'Identity',

    fetch:async user =>
      fetchUrl(
        `https://pronouns.cc/api/v1/users/${encodeURIComponent(user)}`
      ),

    parse:data=>{

      if(
        !data ||
        (
          !data.username &&
          !data.members
        )
      )
        return null;

      return {

        avatar:
          data.avatar_url,

        title:
          data.username ||
          'System',

        handle:
          data.id
            ? `ID ${data.id}`
            : '',

        bio:
          data.biography ||
          data.description ||
          '',

        badges:
          data.pronouns
            ? [data.pronouns]
            : [],

        metrics:[

          {
            l:'Members',
            v:
              data.members
                ? data.members.length
                : 0
          }

        ],

        links:
          data.links || [],

        profileUrl:
          `https://pronouns.cc/p/${data.username}`

      };

    }

  },

  {
    id:'hackernews',
    name:'Hacker News',
    category:'Community',

    fetch:async user =>
      fetchUrl(
        `https://hacker-news.firebaseio.com/v0/user/${encodeURIComponent(user)}.json`
      ),

    parse:data=>{

      if(
        !data ||
        !data.id
      )
        return null;

      return {

        avatar:null,

        title:
          data.id,

        handle:
          `since ${new Date(data.created*1000).getFullYear()}`,

        bio:
          data.about || '',

        badges:[],

        metrics:[

          {
            l:'Karma',
            v:data.karma
          },

          {
            l:'Posts',
            v:
              data.submitted
                ? data.submitted.length
                : 0
          }

        ],

        links:[],

        profileUrl:
          `https://news.ycombinator.com/user?id=${data.id}`

      };

    }

  },

  {
    id:'dev_to',
    name:'Dev.to',
    category:'Developer',

    fetch:async user =>
      fetchUrl(
        `https://dev.to/api/users/by_username?url=${encodeURIComponent(user)}`
      ),

    parse:data=>{

      if(
        !data ||
        !data.username
      )
        return null;

      return {

        avatar:
          data.profile_image,

        title:
          data.name ||
          data.username,

        handle:
          `@${data.username}`,

        bio:
          data.summary || '',

        badges:[
          data.location
        ].filter(Boolean),

        metrics:[

          {
            l:'Joined',
            v:
              data.joined_at
                ? data.joined_at.split(' ')[0]
                : '—'
          }

        ],

        links:[

          data.website_url,

          data.github_username
            ? `https://github.com/${data.github_username}`
            : null

        ].filter(Boolean),

        profileUrl:
          `https://dev.to/${data.username}`

      };

    }

  }

];

/* ================= NETWORK REQUEST ================= */

async function fetchUrl(url){

  try{

    const res =
      await fetch(
        `/api/proxy?url=${encodeURIComponent(url)}`,
        {
          headers:{
            'Accept':'application/json'
          }
        }
      );

    if(!res.ok){

      return {
        status:res.status,
        data:null
      };

    }

    return {

      status:200,

      data:
        await res.json()

    };

  }catch(err){

    return {

      status:'blocked',
      data:null

    };

  }

}

/* ================= ESCAPE ================= */

function esc(str){

  if(typeof str !== 'string')
    return str;

  return str.replace(
    /[&<>'"]/g,
    t=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'

    }[t] || t)
  );

}

/* ================= SEARCH ================= */

searchForm.addEventListener(
  'submit',
  async e=>{

    e.preventDefault();

    const username =
      usernameInput.value.trim();

    if(!username)
      return;

    currentResults=[];

    resultsSection.innerHTML='';

    summary.classList.remove('active');

    progressContainer.classList.add('active');

    searchBtn.disabled=true;

    progressBar.style.width='0%';

    progressPercent.textContent='0%';

    progressText.textContent=
      'Querying sources…';

    let completed=0;
    let found=0;
    let notFound=0;
    let errored=0;

    await Promise.allSettled(

      TARGET_ENDPOINTS.map(
        async endpoint=>{

          const res =
            await endpoint.fetch(username);

          let result={

            endpoint,

            status:'error',

            raw:res.data,

            parsed:null

          };

          if(
            res.status === 200 &&
            res.data
          ){

            const parsed =
              endpoint.parse(res.data);

            if(parsed){

              result.status='found';

              result.parsed=parsed;

              found++;

            }else{

              result.status='not_found';

              notFound++;

            }

          }else if(
            res.status === 404
          ){

            result.status='not_found';

            notFound++;

          }else{

            result.status='error';

            errored++;

          }

          completed++;

          const pct =
            Math.round(
              (
                completed /
                TARGET_ENDPOINTS.length
              ) * 100
            );

          progressBar.style.width =
            pct+'%';

          progressPercent.textContent =
            pct+'%';

          progressText.textContent =
            completed ===
            TARGET_ENDPOINTS.length
              ? 'Search complete'
              : `Querying sources… ${completed}/${TARGET_ENDPOINTS.length}`;

          currentResults.push(result);

        }
      )

    );

    progressContainer.classList.remove(
      'active'
    );

    searchBtn.disabled=false;

    statFound.textContent=found;

    statNotFound.textContent=notFound;

    statErrors.textContent=errored;

    summary.classList.add('active');

    renderResults(username);

  }
);

/* ================= RESULTS ================= */

function renderResults(username){

  resultsSection.innerHTML='';

  const hits =
    currentResults.filter(
      r=>r.status==='found'
    );

  const rest =
    currentResults.filter(
      r=>r.status!=='found'
    );

  if(
    hits.length === 0 &&
    rest.length === 0
  ){

    resultsSection.appendChild(
      emptyState
    );

    return;

  }

  if(hits.length){

    const title =
      document.createElement('p');

    title.className='group-title';

    title.textContent =
      `Matched on ${hits.length} source${hits.length===1?'':'s'}`;

    const grid =
      document.createElement('div');

    grid.className='hits';

    hits.forEach(
      (item,index)=>{

        const card =
          buildCard(item);

        card.style.animationDelay =
          `${index*70}ms`;

        grid.appendChild(card);

      }
    );

    resultsSection.appendChild(title);

    resultsSection.appendChild(grid);

  }else{

    const none =
      document.createElement('div');

    none.className='empty';

    none.innerHTML =
      `<b>No public match for "${esc(username)}"</b>
       Checked ${currentResults.length} sources — nothing came back as a confirmed profile.`;

    resultsSection.appendChild(none);

  }

  if(rest.length){

    const details =
      document.createElement('details');

    details.className='misses';

    const summaryEl =
      document.createElement('summary');

    summaryEl.innerHTML =
      `<span>${rest.length} source${rest.length===1?'':'s'} with no record or a blocked request</span>
       <span class="chev">›</span>`;

    details.appendChild(summaryEl);

    rest.forEach(
      (r,index)=>{

        const row =
          document.createElement('div');

        row.className='miss-row';

        row.style.animationDelay =
          `${index*35}ms`;

        row.innerHTML =
          `<span class="n">${esc(r.endpoint.name)}</span>
           <span class="s ${r.status==='error'?'er':'nf'}">
           ${r.status==='error'?'blocked':'no record'}
           </span>`;

        details.appendChild(row);

      }
    );

    resultsSection.appendChild(details);

  }

}

/* ================= CARD ================= */

function buildCard(item){

  const p =
    item.parsed;

  const card =
    document.createElement('div');

  card.className='card';

  const avatarHTML =
    p.avatar

      ? `<img
           class="avatar"
           src="${esc(p.avatar)}"
           alt=""
           onerror="this.outerHTML='<div class=avatar-fallback>${esc((p.title||'?').charAt(0).toUpperCase())}</div>'">`

      : `<div class="avatar-fallback">
           ${esc(
             (p.title||'?')
               .charAt(0)
               .toUpperCase()
           )}
         </div>`;

  const badges =
    (p.badges || [])
      .filter(Boolean)
      .map(
        b =>
          `<span class="badge">
            ${esc(String(b))}
           </span>`
      )
      .join('');

  const metrics =
    (p.metrics || [])
      .map(
        m =>
          `<div class="metric">

             <div class="v">
               ${esc(String(m.v))}
             </div>

             <div class="l">
               ${esc(m.l)}
             </div>

           </div>`
      )
      .join('');

  const clubs =
    (p.clubs || []).length

      ? `<div class="clublist">

           ${p.clubs.map(
             c =>
               `<a
                  href="${esc(c.url)}"
                  target="_blank"
                  rel="noopener">

                  ${c.icon
                    ? `<img
                         src="${esc(c.icon)}"
                         alt="">`
                    : ''}

                  ${esc(c.name)}

                </a>`
           ).join('')}

         </div>`

      : '';

  card.innerHTML = `

    <div class="card-head">

      <div class="card-id">

        ${avatarHTML}

        <div class="card-src">

          <div class="name">
            ${esc(item.endpoint.name)}
          </div>

          <div class="cat">
            ${esc(item.endpoint.category)}
          </div>

        </div>

      </div>

      <button
        class="inspect-btn"
        title="View raw response"
        aria-label="View raw response">
        { }
      </button>

    </div>

    <div class="card-title">
      ${esc(p.title || '')}
    </div>

    <div class="card-handle">
      ${esc(p.handle || '')}
    </div>

    ${
      p.bio
        ? `<div class="card-bio">
             ${esc(p.bio)}
           </div>`
        : ''
    }

    ${
      badges
        ? `<div class="badges">
             ${badges}
           </div>`
        : ''
    }

    ${
      metrics
        ? `<div class="metrics">
             ${metrics}
           </div>`
        : ''
    }

    ${clubs}

    <div class="card-foot">

      <span class="id mono">
        ${esc(item.endpoint.id)}
      </span>

      ${
        p.profileUrl
          ? `<a
               class="open"
               href="${esc(p.profileUrl)}"
               target="_blank"
               rel="noopener">
               Open profile
             </a>`
          : ''
      }

    </div>

  `;

  card
    .querySelector('.inspect-btn')
    .addEventListener(
      'click',
      ()=>{

        modalTitle.textContent =
          `${item.endpoint.name} — raw response`;

        rawModalJSON =
          item.raw ||
          {
            status:'No payload'
          };

        modalJsonContent.textContent =
          JSON.stringify(
            rawModalJSON,
            null,
            2
          );

        jsonModal.classList.add('open');

      }
    );

  return card;

}

/* ================= COPY RESULTS ================= */

copySummaryBtn.addEventListener(
  'click',
  ()=>{

    const hits =
      currentResults.filter(
        r=>r.status==='found'
      );

    if(!hits.length)
      return;

    let text =
      `Argus OSINT report — ${usernameInput.value.trim()}\n\n`;

    hits.forEach(i=>{

      const p =
        i.parsed;

      text +=
        `${i.endpoint.name} (${p.handle})\n`;

      if(p.title)
        text +=
          `Name: ${p.title}\n`;

      if(p.bio)
        text +=
          `Bio: ${p.bio}\n`;

      text +=
        `URL: ${p.profileUrl}\n\n`;

    });

    navigator.clipboard
      .writeText(text)
      .then(()=>{

        const old =
          copySummaryBtn.textContent;

        copySummaryBtn.textContent =
          'Copied';

        setTimeout(
          ()=>{
            copySummaryBtn.textContent=old;
          },
          1500
        );

      });

  }
);

/* ================= MODAL ================= */

document
  .getElementById('closeModalBtn')
  .addEventListener(
    'click',
    ()=>{
      jsonModal.classList.remove('open');
    }
  );

jsonModal.addEventListener(
  'click',
  e=>{

    if(e.target === jsonModal)
      jsonModal.classList.remove('open');

  }
);

document
  .getElementById('copyModalJsonBtn')
  .addEventListener(
    'click',
    ()=>{

      if(!rawModalJSON)
        return;

      navigator.clipboard
        .writeText(
          JSON.stringify(
            rawModalJSON,
            null,
            2
          )
        )
        .then(()=>{

          const btn =
            document.getElementById(
              'copyModalJsonBtn'
            );

          const old =
            btn.textContent;

          btn.textContent =
            'Copied';

          setTimeout(
            ()=>{
              btn.textContent=old;
            },
            1500
          );

        });

    }
  );

/* ================= ESC CLOSE MODAL ================= */

document.addEventListener(
  'keydown',
  e=>{

    if(e.key === 'Escape')
      jsonModal.classList.remove('open');

  }
);

/* ================= THEME ================= */

const themeBtn =
  document.getElementById(
    'themeBtn'
  );

(function initTheme(){

  const prefersLight =
    window.matchMedia(
      '(prefers-color-scheme: light)'
    ).matches;

  const initial =
    prefersLight
      ? 'light'
      : 'dark';

  document.documentElement
    .setAttribute(
      'data-theme',
      initial
    );

  themeBtn.textContent =
    initial === 'light'
      ? 'Dark mode'
      : 'Light mode';

})();

themeBtn.addEventListener(
  'click',
  ()=>{

    const current =
      document.documentElement
        .getAttribute('data-theme');

    const next =
      current === 'light'
        ? 'dark'
        : 'light';

    document.documentElement
      .setAttribute(
        'data-theme',
        next
      );

    themeBtn.textContent =
      next === 'light'
        ? 'Dark mode'
        : 'Light mode';

  }
);

</script>
