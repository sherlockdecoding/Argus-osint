<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argus OSINT — public profile lookup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>

  :root{
    --bg:#12151a;
    --surface:#1a1e25;
    --surface-2:#20242c;
    --border:#2a2f3a;
    --text:#e7e9ec;
    --muted:#8a92a3;
    --faint:#5c6472;
    --accent:#5b8def;
    --accent-dim:rgba(91,141,239,.14);
    --ok:#4caf7d;
    --ok-dim:rgba(76,175,125,.14);
    --err:#e2645c;
    --err-dim:rgba(226,100,92,.12);
    font-size:16px;
  }

  @media (prefers-color-scheme: light){

    :root:not([data-theme="dark"]){
      --bg:#f5f6f8;
      --surface:#ffffff;
      --surface-2:#fbfbfc;
      --border:#e1e4e9;
      --text:#1a1d22;
      --muted:#656d7c;
      --faint:#9aa1ad;
      --accent:#3568d4;
      --accent-dim:rgba(53,104,212,.08);
      --ok:#2b8a5d;
      --ok-dim:rgba(43,138,93,.08);
      --err:#c0433c;
      --err-dim:rgba(192,67,60,.08);
    }

  }

  :root[data-theme="light"]{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#fbfbfc;
    --border:#e1e4e9;
    --text:#1a1d22;
    --muted:#656d7c;
    --faint:#9aa1ad;
    --accent:#3568d4;
    --accent-dim:rgba(53,104,212,.08);
    --ok:#2b8a5d;
    --ok-dim:rgba(43,138,93,.08);
    --err:#c0433c;
    --err-dim:rgba(192,67,60,.08);
  }


  *{
    box-sizing:border-box;
  }


  html,
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
  }


  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }


  .mono{
    font-family:'IBM Plex Mono',monospace;
  }


  a{
    color:var(--accent);
    text-decoration:none;
  }


  a:hover{
    text-decoration:underline;
  }


  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:0 20px;
  }


  header .wrap{
    padding-right:40px;
  }


  /* =========================
     HEADER
  ========================= */

  header{
    position:sticky;
    top:0;
    padding-top:env(safe-area-inset-top,0px);
    background:var(--bg);
    border-bottom:1px solid var(--border);
    z-index:20;
  }


  .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
  }


  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }


  /*
     LARGE ARGUS LOGO

     logo.png should be in the
     same folder as this HTML file.
  */

  .brand-logo{
    width:150px;
    height:150px;
    object-fit:contain;
    display:block;
    flex-shrink:0;
  }


  .brand-text{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
  }


  .brand .name{
    font-weight:700;
    font-size:28px;
    letter-spacing:-.25px;
    white-space:nowrap;
  }


  .brand .tag{
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
  }


  .theme-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    border-radius:7px;
    padding:6px 10px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
    flex-shrink:0;
  }


  .theme-btn:hover{
    color:var(--text);
    border-color:var(--faint);
  }


  /* =========================
     MAIN
  ========================= */

  main{
    padding:28px 0 60px;
  }


  .search-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:28px;
  }


  .search-card h1{
    font-size:19px;
    margin:0 0 4px;
    font-weight:600;
  }


  .search-card p.sub{
    margin:0 0 16px;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
    max-width:60ch;
  }


  form{
    display:flex;
    gap:10px;
  }


  input[type="text"]{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:11px 14px;
    font-size:14.5px;
    font-family:'IBM Plex Mono',monospace;
    min-width:0;
  }


  input[type="text"]:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
  }


  input[type="text"]::placeholder{
    color:var(--faint);
    font-family:'IBM Plex Sans',sans-serif;
  }


  button[type="submit"]{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:11px 20px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }


  button[type="submit"]:hover{
    filter:brightness(1.08);
  }


  button[type="submit"]:disabled{
    opacity:.5;
    cursor:default;
  }


  button:focus-visible,
  a:focus-visible,
  input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }


  /* =========================
     PROGRESS
  ========================= */

  .progress{
    margin-top:16px;
    display:none;
  }


  .progress.active{
    display:block;
  }


  .progress-line{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }


  .progress-track{
    height:3px;
    background:var(--surface-2);
    border-radius:2px;
    overflow:hidden;
  }


  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .25s ease;
  }


  /* =========================
     SUMMARY
  ========================= */

  .summary{
    display:none;
    align-items:center;
    gap:18px;
    font-size:13px;
    color:var(--muted);
    margin-bottom:18px;
    flex-wrap:wrap;
  }


  .summary.active{
    display:flex;
  }


  .summary b{
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
  }


  .summary .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    display:inline-block;
    margin-right:5px;
  }


  .summary .copy-btn{
    margin-left:auto;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    border-radius:7px;
    padding:6px 12px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
  }


  .summary .copy-btn:hover{
    color:var(--text);
    border-color:var(--faint);
  }


  /* =========================
     GROUPS
  ========================= */

  section.group{
    margin-bottom:30px;
  }


  .group-title{
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    margin:0 0 12px;
  }


  .empty{
    border:1px dashed var(--border);
    border-radius:12px;
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
  }


  .empty b{
    color:var(--text);
    display:block;
    margin-bottom:4px;
    font-size:14.5px;
  }


  /* =========================
     RESULT CARDS
  ========================= */

  .hits{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:12px;
  }


  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--ok);
    border-radius:10px;
    padding:16px;
    animation:rise .35s ease both;
  }


  @keyframes rise{

    from{
      opacity:0;
      transform:translateY(6px);
    }

    to{
      opacity:1;
      transform:translateY(0);
    }

  }


  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }


  .card-id{
    display:flex;
    gap:10px;
    align-items:center;
    min-width:0;
  }


  .avatar{
    width:34px;
    height:34px;
    border-radius:8px;
    object-fit:cover;
    flex-shrink:0;
    background:var(--surface-2);
    border:1px solid var(--border);
  }


  .avatar-fallback{
    width:34px;
    height:34px;
    border-radius:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
    color:var(--muted);
    flex-shrink:0;
  }


  .card-src{
    min-width:0;
  }


  .card-src .name{
    font-weight:600;
    font-size:13.5px;
  }


  .card-src .cat{
    font-size:11.5px;
    color:var(--muted);
  }


  .inspect-btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--faint);
    border-radius:6px;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }


  .inspect-btn:hover{
    color:var(--text);
    border-color:var(--faint);
  }


  .card-title{
    font-size:14.5px;
    font-weight:600;
    margin-bottom:1px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }


  .card-handle{
    font-size:12.5px;
    color:var(--accent);
    font-family:'IBM Plex Mono',monospace;
    margin-bottom:10px;
  }


  .card-bio{
    font-size:12.5px;
    color:var(--muted);
    line-height:1.55;
    margin-bottom:10px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }


  .badges{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-bottom:10px;
  }


  .badge{
    font-size:10.5px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--muted);
    padding:2px 7px;
    border-radius:5px;
    font-family:'IBM Plex Mono',monospace;
  }


  .metrics{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
    gap:6px;
    margin-bottom:10px;
  }


  .metric{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:7px;
    padding:6px 8px;
    text-align:center;
  }


  .metric .v{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
  }


  .metric .l{
    font-size:9.5px;
    color:var(--faint);
    margin-top:1px;
  }


  .clublist{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:10px;
  }


  .clublist a{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:4px 7px;
  }


  .clublist img{
    width:16px;
    height:16px;
    border-radius:4px;
  }


  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:10px;
    border-top:1px solid var(--border);
  }


  .card-foot .open{
    font-size:12px;
    font-weight:600;
  }


  .card-foot .id{
    font-size:11px;
    color:var(--faint);
    font-family:'IBM Plex Mono',monospace;
  }


  /* =========================
     MISSES
  ========================= */

  details.misses{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--surface);
  }


  details.misses summary{
    list-style:none;
    cursor:pointer;
    padding:12px 16px;
    font-size:13px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }


  details.misses summary::-webkit-details-marker{
    display:none;
  }


  details.misses summary .chev{
    transition:transform .15s ease;
    color:var(--faint);
  }


  details.misses[open] summary .chev{
    transform:rotate(90deg);
  }


  .miss-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 16px;
    font-size:12.5px;
    border-top:1px solid var(--border);
  }


  .miss-row .n{
    color:var(--muted);
  }


  .miss-row .s{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:1px 6px;
    border-radius:4px;
  }


  .miss-row .s.nf{
    color:var(--faint);
    background:var(--surface-2);
  }


  .miss-row .s.er{
    color:var(--err);
    background:var(--err-dim);
  }


  /* =========================
     MODAL
  ========================= */

  .modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }


  .modal-bg.open{
    display:flex;
  }


  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    max-width:640px;
    width:100%;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }


  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }


  .modal-head h3{
    margin:0;
    font-size:13.5px;
    font-weight:600;
  }


  .modal-head button{
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
  }


  .modal-body{
    padding:14px 16px;
    overflow:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ok);
    white-space:pre-wrap;
    word-break:break-all;
    background:var(--surface-2);
  }


  .modal-foot{
    padding:10px 16px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
  }


  .modal-foot button{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    border-radius:7px;
    padding:7px 14px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
  }


  .hidden{
    display:none !important;
  }


  /* =========================
     MOBILE
  ========================= */

  @media (max-width:600px){

    .header-row{
      padding:10px 0;
    }


    .brand{
      gap:10px;
    }


    .brand-logo{
      width:100px;
      height:100px;
    }


    .brand-text{
      gap:0;
    }


    .brand .name{
      font-size:20px;
    }


    .brand .tag{
      display:none;
    }


    form{
      flex-direction:column;
    }

  }

</style>
</head>


<body>


<header>

  <div class="wrap header-row">

    <div class="brand">

      <img
        src="logo.png"
        class="brand-logo"
        alt="Argus OSINT logo"
      >

      <div class="brand-text">

        <span class="name">
          Argus OSINT
        </span>

        <span class="tag">
          public profile lookup
        </span>

      </div>

    </div>


    <button
      class="theme-btn"
      id="themeBtn"
    >
      Light mode
    </button>

  </div>

</header>


<main class="wrap">


  <section class="search-card">

    <h1>
      Look up a handle
    </h1>


    <p class="sub">
      Search for publicly available profile information and explore matching accounts.
    </p>


    <form id="searchForm">

      <input
        type="text"
        id="usernameInput"
        placeholder="e.g. octocat"
        required
        autocomplete="off"
      >


      <button
        type="submit"
        id="searchBtn"
      >
        Check
      </button>

    </form>


    <div
      class="progress"
      id="progressContainer"
    >

      <div class="progress-line">

        <span id="progressText">
          Querying sources…
        </span>


        <span id="progressPercent">
          0%
        </span>

      </div>


      <div class="progress-track">

        <div
          class="progress-fill"
          id="progressBar"
        ></div>

      </div>

    </div>

  </section>


  <div
    class="summary"
    id="summary"
  >

    <span>

      <span
        class="dot"
        style="background:var(--ok)"
      ></span>

      <b id="statFound">
        0
      </b>

      matched

    </span>


    <span>

      <span
        class="dot"
        style="background:var(--faint)"
      ></span>

      <b id="statNotFound">
        0
      </b>

      no record

    </span>


    <span>

      <span
        class="dot"
        style="background:var(--err)"
      ></span>

      <b id="statErrors">
        0
      </b>

      blocked / errored

    </span>


    <button
      class="copy-btn"
      id="copySummaryBtn"
    >
      Copy results
    </button>

  </div>


  <section
    class="group"
    id="resultsSection"
  >

    <div
      class="empty"
      id="emptyState"
    >

      <b>
        No lookup run yet
      </b>

      Enter a handle above and press Check to search for public profiles.

    </div>

  </section>


</main>


<div
  class="modal-bg"
  id="jsonModal"
>

  <div class="modal">


    <div class="modal-head">

      <h3 id="modalTitle">
        Raw response
      </h3>


      <button id="closeModalBtn">
        ✕
      </button>

    </div>


    <div class="modal-body">

      <pre
        id="modalJsonContent"
        style="margin:0;"
      ></pre>

    </div>


    <div class="modal-foot">

      <button id="copyModalJsonBtn">
        Copy JSON
      </button>

    </div>

  </div>

</div>


<script>


/* =========================
   TARGET ENDPOINTS
========================= */

const TARGET_ENDPOINTS = [


  {
    id:'pronouns_page',
    name:'Pronouns.page',
    category:'Identity',


    fetch: async (user)=>{

      const url=
        `https://en.pronouns.page/api/public/v3/users/${encodeURIComponent(user)}`;

      return await fetchUrl(url);

    },


    parse:(data)=>{

      if(!data || !data.profiles){
        return null;
      }


      const en=
        data.profiles.en ||
        Object.values(data.profiles)[0];


      if(!en){
        return null;
      }


      const names=
        (en.names||[])
          .map(
            n=>
              typeof n==='string'
                ? n
                : n.value||n.name
          )
          .filter(Boolean);


      const pronouns=
        (en.pronouns||[])
          .map(
            p=>
              typeof p==='string'
                ? p
                : p.value||p.pronoun
          )
          .filter(Boolean);


      const links=
        (en.links||[])
          .map(
            l=>
              typeof l==='string'
                ? l
                : l.href||l.link
          )
          .filter(Boolean);


      return {

        avatar:data.avatar||null,

        title:
          names[0] ||
          data.username,

        handle:
          `@${data.username}`,

        bio:
          en.bio||'',

        badges:
          pronouns,

        metrics:[
          {
            l:'Names',
            v:names.length
          },
          {
            l:'Pronouns',
            v:pronouns.length
          }
        ],

        links,

        profileUrl:
          `https://pronouns.page/@${data.username}`

      };

    }

  },


  {
    id:'chess_com',
    name:'Chess.com',
    category:'Gaming',


    fetch: async (user)=>{

      const base=
        `https://api.chess.com/pub/player/${encodeURIComponent(user)}`;


      const profileRes=
        await fetchUrl(base);


      if(profileRes.status!==200){
        return profileRes;
      }


      const [
        statsRes,
        clubsRes
      ]=
        await Promise.allSettled([

          fetchUrl(`${base}/stats`),

          fetchUrl(`${base}/clubs`)

        ]);


      return {

        status:200,

        data:{

          profile:
            profileRes.data,

          stats:
            statsRes.status==='fulfilled' &&
            statsRes.value.status===200
              ? statsRes.value.data
              : null,

          clubs:
            clubsRes.status==='fulfilled' &&
            clubsRes.value.status===200
              ? clubsRes.value.data.clubs
              : []

        }

      };

    },


    parse:(payload)=>{

      if(
        !payload ||
        !payload.profile ||
        !payload.profile.username
      ){
        return null;
      }


      const p=
        payload.profile;

      const s=
        payload.stats||{};

      const clubs=
        payload.clubs||[];


      return {

        avatar:
          p.avatar,

        title:
          p.name ||
          p.username,

        handle:

/* =========================
   NETWORK REQUEST
========================= */

async function fetchUrl(url){

  try{

    const res=
      await fetch(
        url,
        {
          headers:{
            'Accept':'application/json'
          }
        }
      );


    if(!res.ok){

      return {
        status:res.status,
        data:null
      };

    }


    return {

      status:200,

      data:
        await res.json()

    };

  }catch(err){

    return {

      status:'blocked',

      data:null

    };

  }

}

/* =========================
   ESCAPE HTML
========================= */

function esc(str){

  if(typeof str!=='string'){
    return str;
  }


  return str.replace(
    /[&<>'"]/g,

    t=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'

    }[t]||t)

  );

}


/* =========================
   SEARCH
========================= */

searchForm.addEventListener(
  'submit',

  async e=>{

    e.preventDefault();


    const username=
      usernameInput.value.trim();


    if(!username){
      return;
    }


    currentResults=[];


    resultsSection.innerHTML='';


    summary.classList.remove(
      'active'
    );


    progressContainer.classList.add(
      'active'
    );


    searchBtn.disabled=true;


    progressBar.style.width='0%';

    progressPercent.textContent='0%';

    progressText.textContent=
      'Querying sources…';


    let completed=0;

    let found=0;

    let notFound=0;

    let errored=0;


    await Promise.allSettled(

      TARGET_ENDPOINTS.map(

        async endpoint=>{

          const res=
            await endpoint.fetch(
              username
            );


          let result={

            endpoint,

            status:'error',

            raw:res.data,

            parsed:null

          };


          if(
            res.status===200 &&
            res.data
          ){

            const parsed=
              endpoint.parse(
                res.data
              );


            if(parsed){

              result.status=
                'found';

              result.parsed=
                parsed;

              found++;

            }else{

              result.status=
                'not_found';

              notFound++;

            }

          }else if(
            res.status===404
          ){

            result.status=
              'not_found';

            notFound++;

          }else{

            result.status=
              'error';

            errored++;

          }


          completed++;


          const pct=
            Math.round(
              (
                completed /
                TARGET_ENDPOINTS.length
              ) *
              100
            );


          progressBar.style.width=
            pct+'%';


          progressPercent.textContent=
            pct+'%';


          progressText.textContent=
            completed===
            TARGET_ENDPOINTS.length

              ? 'Search complete'

              : `Querying sources… ${completed}/${TARGET_ENDPOINTS.length}`;


          currentResults.push(
            result
          );

        }

      )

    );


    progressContainer.classList.remove(
      'active'
    );


    searchBtn.disabled=false;


    statFound.textContent=
      found;


    statNotFound.textContent=
      notFound;


    statErrors.textContent=
      errored;


    summary.classList.add(
      'active'
    );


    renderResults(
      username
    );

  }

);


/* =========================
   RESULTS
========================= */

function renderResults(
  username
){

  resultsSection.innerHTML='';


  const hits=
    currentResults.filter(
      r=>r.status==='found'
    );


  const rest=
    currentResults.filter(
      r=>r.status!=='found'
    );


  if(
    hits.length===0 &&
    rest.length===0
  ){

    resultsSection.appendChild(
      emptyState
    );

    return;

  }


  if(hits.length){

    const title=
      document.createElement(
        'p'
      );


    title.className=
      'group-title';


    title.textContent=
      `Matched on ${hits.length} source${hits.length===1?'':'s'}`;


    const grid=
      document.createElement(
        'div'
      );


    grid.className=
      'hits';


    hits.forEach(
      item=>
        grid.appendChild(
          buildCard(item)
        )
    );


    resultsSection.appendChild(
      title
    );


    resultsSection.appendChild(
      grid
    );

  }else{

    const none=
      document.createElement(
        'div'
      );


    none.className=
      'empty';


    none.innerHTML=
      `<b>No public match for "${esc(username)}"</b>
       Checked ${currentResults.length} sources — nothing came back as a confirmed profile.`;


    resultsSection.appendChild(
      none
    );

  }


  if(rest.length){

    const details=
      document.createElement(
        'details'
      );


    details.className=
      'misses';


    const summaryEl=
      document.createElement(
        'summary'
      );


    summaryEl.innerHTML=
      `<span>${rest.length} source${rest.length===1?'':'s'} with no record or a blocked request</span>
       <span class="chev">›</span>`;


    details.appendChild(
      summaryEl
    );


    rest.forEach(
      r=>{

        const row=
          document.createElement(
            'div'
          );


        row.className=
          'miss-row';


        row.innerHTML=
          `<span class="n">
            ${esc(r.endpoint.name)}
          </span>

          <span class="s ${r.status==='error'?'er':'nf'}">
            ${r.status==='error'
              ? 'blocked'
              : 'no record'}
          </span>`;


        details.appendChild(
          row
        );

      }
    );


    resultsSection.appendChild(
      details
    );

  }

}


/* =========================
   PROFILE CARD
========================= */

function buildCard(item){

  const p=
    item.parsed;


  const card=
    document.createElement(
      'div'
    );


  card.className=
    'card';


  const avatarHTML=

    p.avatar

      ? `<img
           class="avatar"
           src="${esc(p.avatar)}"
           alt=""
           onerror="this.outerHTML='<div class=avatar-fallback>${esc((p.title||'?').charAt(0).toUpperCase())}</div>"
         >`

      : `<div class="avatar-fallback">
           ${esc(
             (p.title||'?')
               .charAt(0)
               .toUpperCase()
           )}
         </div>`;


  const badges=
    (p.badges||[])
      .filter(Boolean)
      .map(
        b=>
          `<span class="badge">
             ${esc(String(b))}
           </span>`
      )
      .join('');


  const metrics=
    (p.metrics||[])
      .map(
        m=>
          `<div class="metric">

             <div class="v">
               ${esc(String(m.v))}
             </div>

             <div class="l">
               ${esc(m.l)}
             </div>

           </div>`
      )
      .join('');


  const clubs=
    (p.clubs||[]).length

      ? `<div class="clublist">

          ${p.clubs.map(
            c=>
              `<a
                 href="${esc(c.url)}"
                 target="_blank"
                 rel="noopener"
               >

                 ${c.icon
                   ? `<img
                        src="${esc(c.icon)}"
                        alt=""
                      >`
                   : ''
                 }

                 ${esc(c.name)}

               </a>`
          ).join('')}

        </div>`

      : '';


  card.innerHTML=`

    <div class="card-head">

      <div class="card-id">

        ${avatarHTML}

        <div class="card-src">

          <div class="name">
            ${esc(
              item.endpoint.name
            )}
          </div>

          <div class="cat">
            ${esc(
              item.endpoint.category
            )}
          </div>

        </div>

      </div>


      <button
        class="inspect-btn"
        title="View raw response"
        aria-label="View raw response"
      >
        { }
      </button>

    </div>


    <div class="card-title">
      ${esc(p.title||'')}
    </div>


    <div class="card-handle">
      ${esc(p.handle||'')}
    </div>


    ${
      p.bio

        ? `<div class="card-bio">
             ${esc(p.bio)}
           </div>`

        : ''
    }


    ${
      badges

        ? `<div class="badges">
             ${badges}
           </div>`

        : ''
    }


    ${
      metrics

        ? `<div class="metrics">
             ${metrics}
           </div>`

        : ''
    }


    ${clubs}


    <div class="card-foot">

      <span class="id mono">
        ${esc(item.endpoint.id)}
      </span>


      ${
        p.profileUrl

          ? `<a
               class="open"
               href="${esc(p.profileUrl)}"
               target="_blank"
               rel="noopener"
             >
               Open profile
             </a>`

          : ''
      }

    </div>

  `;


  card
    .querySelector(
      '.inspect-btn'
    )
    .addEventListener(

      'click',

      ()=>{

        modalTitle.textContent=
          `${item.endpoint.name} — raw response`;


        rawModalJSON=
          item.raw || {
            status:'No payload'
          };


        modalJsonContent.textContent=
          JSON.stringify(
            rawModalJSON,
            null,
            2
          );


        jsonModal.classList.add(
          'open'
        );

      }

    );


  return card;

}

========================= */

copySummaryBtn.addEventListener(

  'click',

  ()=>{

    const hits=
      currentResults.filter(
        r=>r.status==='found'
      );


    if(!hits.length){
      return;
    }


    let text=
      `Argus OSINT report — ${usernameInput.value.trim()}\n\n`;


    hits.forEach(
      i=>{

        const p=
          i.parsed;


        text+=
          `${i.endpoint.name} (${p.handle})\n`;


        if(p.title){

          text+=
            `Name: ${p.title}\n`;

        }


        if(p.bio){

          text+=
            `Bio: ${p.bio}\n`;

        }


        text+=
          `URL: ${p.profileUrl}\n\n`;

      }
    );


    navigator.clipboard
      .writeText(text)

      .then(
        ()=>{

          const old=
            copySummaryBtn.textContent;


          copySummaryBtn.textContent=
            'Copied';


          setTimeout(
            ()=>{

              copySummaryBtn.textContent=
                old;

            },

            1500
          );

        }
      );

  }

);

/* =========================
   THEME
========================= */

const themeBtn=
  document.getElementById(
    'themeBtn'
  );


(function initTheme(){

  const prefersLight=
    window.matchMedia(
      '(prefers-color-scheme: light)'
    ).matches;


  const initial=
    prefersLight
      ? 'light'
      : 'dark';


  document.documentElement
    .setAttribute(
      'data-theme',
      initial
    );


  themeBtn.textContent=
    initial==='light'
      ? 'Dark mode'
      : 'Light mode';

})();


themeBtn.addEventListener(

  'click',

  ()=>{

    const current=
      document.documentElement
        .getAttribute(
          'data-theme'
        );


    const next=
      current==='light'
        ? 'dark'
        : 'light';


    document.documentElement
      .setAttribute(
        'data-theme',
        next
      );


    themeBtn.textContent=
      next==='light'
        ? 'Dark mode'
        : 'Light mode';

  }

);

</script>

</body>
</html>
