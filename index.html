<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Argus OSINT — public profile lookup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<style>
:root{
  --bg:#12151a;
  --surface:#1a1e25;
  --surface-2:#20242c;
  --border:#2a2f3a;
  --text:#e7e9ec;
  --muted:#8a92a3;
  --faint:#5c6472;
  --accent:#5b8def;
  --accent-dim:rgba(91,141,239,.14);
  --ok:#4caf7d;
  --ok-dim:rgba(76,175,125,.14);
  --err:#e2645c;
  --err-dim:rgba(226,100,92,.12);
  font-size:16px;
}

@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8;
    --surface:#fff;
    --surface-2:#fbfbfc;
    --border:#e1e4e9;
    --text:#1a1d22;
    --muted:#656d7c;
    --faint:#9aa1ad;
    --accent:#3568d4;
    --accent-dim:rgba(53,104,212,.08);
    --ok:#2b8a5d;
    --ok-dim:rgba(43,138,93,.08);
    --err:#c0433c;
    --err-dim:rgba(192,67,60,.08);
  }
}

:root[data-theme="light"]{
  --bg:#f5f6f8;
  --surface:#fff;
  --surface-2:#fbfbfc;
  --border:#e1e4e9;
  --text:#1a1d22;
  --muted:#656d7c;
  --faint:#9aa1ad;
  --accent:#3568d4;
  --accent-dim:rgba(53,104,212,.08);
  --ok:#2b8a5d;
  --ok-dim:rgba(43,138,93,.08);
  --err:#c0433c;
  --err-dim:rgba(192,67,60,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}

.mono{font-family:'IBM Plex Mono',monospace}

a{
  color:var(--accent);
  text-decoration:none;
}

a:hover{text-decoration:underline}

.wrap{
  max-width:960px;
  margin:0 auto;
  padding:0 20px;
}

header .wrap{
  padding-right:40px;
  padding-left:16px;
}

header{
  position:sticky;
  top:0;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--bg);
  border-bottom:1px solid var(--border);
  z-index:20;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.brand-logo{
  width:150px;
  height:150px;
  object-fit:contain;
  display:block;
  flex-shrink:0;
}

.brand-text{
  display:flex;
  align-items:baseline;
  gap:10px;
  min-width:0;
}

.brand .name{
  font-weight:700;
  font-size:28px;
  letter-spacing:-.25px;
  white-space:nowrap;
}

.brand .tag{
  font-size:12.5px;
  color:var(--muted);
  white-space:nowrap;
}

.theme-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  border-radius:7px;
  padding:6px 10px;
  font-size:12.5px;
  cursor:pointer;
  font-family:inherit;
  flex-shrink:0;
}

.theme-btn:hover{
  color:var(--text);
  border-color:var(--faint);
}

main{
  padding:28px 0 60px;
}

.search-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:28px;
}

.search-card h1{
  font-size:19px;
  margin:0 0 4px;
  font-weight:600;
}

.search-card p.sub{
  margin:0 0 16px;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.5;
  max-width:60ch;
}

form{
  display:flex;
  gap:10px;
}

input[type="text"]{
  flex:1;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:8px;
  padding:11px 14px;
  font-size:14.5px;
  font-family:'IBM Plex Mono',monospace;
  min-width:0;
}

input[type="text"]:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}

input[type="text"]::placeholder{
  color:var(--faint);
  font-family:'IBM Plex Sans',sans-serif;
}

button[type="submit"]{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:11px 20px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
  white-space:nowrap;
}

button[type="submit"]:hover{filter:brightness(1.08)}

button[type="submit"]:disabled{
  opacity:.5;
  cursor:default;
}

button:focus-visible,
a:focus-visible,
input:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

.progress{
  margin-top:16px;
  display:none;
}

.progress.active{display:block}

.progress-line{
  display:flex;
  justify-content:space-between;
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:6px;
}

.progress-track{
  height:3px;
  background:var(--surface-2);
  border-radius:2px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:var(--accent);
  width:0%;
  transition:width .25s ease;
}

.summary{
  display:none;
  align-items:center;
  gap:18px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:18px;
  flex-wrap:wrap;
}

.summary.active{display:flex}

.summary b{
  color:var(--text);
  font-family:'IBM Plex Mono',monospace;
}

.summary .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
}

.summary .copy-btn{
  margin-left:auto;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  border-radius:7px;
  padding:6px 12px;
  font-size:12.5px;
  cursor:pointer;
  font-family:inherit;
}

.summary .copy-btn:hover{
  color:var(--text);
  border-color:var(--faint);
}

section.group{margin-bottom:30px}

.group-title{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin:0 0 12px;
}

.empty{
  border:1px dashed var(--border);
  border-radius:12px;
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.6;
}

.empty b{
  color:var(--text);
  display:block;
  margin-bottom:4px;
  font-size:14.5px;
}

.hits{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:12px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--ok);
  border-radius:10px;
  padding:16px;
  animation:rise .35s ease both;
}

@keyframes rise{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.card-id{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:0;
}

.avatar,
.avatar-fallback{
  width:34px;
  height:34px;
  border-radius:8px;
  flex-shrink:0;
}

.avatar{
  object-fit:cover;
  background:var(--surface-2);
  border:1px solid var(--border);
}

.avatar-fallback{
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  color:var(--muted);
}

.card-src{min-width:0}

.card-src .name{
  font-weight:600;
  font-size:13.5px;
}

.card-src .cat{
  font-size:11.5px;
  color:var(--muted);
}

.inspect-btn{
  border:1px solid var(--border);
  background:transparent;
  color:var(--faint);
  border-radius:6px;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
}

.inspect-btn:hover{
  color:var(--text);
  border-color:var(--faint);
}

.card-title{
  font-size:14.5px;
  font-weight:600;
  margin-bottom:1px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.card-handle{
  font-size:12.5px;
  color:var(--accent);
  font-family:'IBM Plex Mono',monospace;
  margin-bottom:10px;
}

.card-bio{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.55;
  margin-bottom:10px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:10px;
}

.badge{
  font-size:10.5px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--muted);
  padding:2px 7px;
  border-radius:5px;
  font-family:'IBM Plex Mono',monospace;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:6px;
  margin-bottom:10px;
}

.metric{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:7px;
  padding:6px 8px;
  text-align:center;
}

.metric .v{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:600;
}

.metric .l{
  font-size:9.5px;
  color:var(--faint);
  margin-top:1px;
}

.clublist{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:10px;
}

.clublist a{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  color:var(--text);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:4px 7px;
}

.clublist img{
  width:16px;
  height:16px;
  border-radius:4px;
}

.card-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-top:10px;
  border-top:1px solid var(--border);
}

.card-foot .open{
  font-size:12px;
  font-weight:600;
}

.card-foot .id{
  font-size:11px;
  color:var(--faint);
  font-family:'IBM Plex Mono',monospace;
}

details.misses{
  margin-top:14px;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--surface);
}

details.misses summary{
  list-style:none;
  cursor:pointer;
  padding:12px 16px;
  font-size:13px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
}

details.misses summary::-webkit-details-marker{
  display:none;
}

details.misses summary .chev{
  transition:transform .15s ease;
  color:var(--faint);
}

details.misses[open] summary .chev{
  transform:rotate(90deg);
}

.miss-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 16px;
  font-size:12.5px;
  border-top:1px solid var(--border);
}

.miss-row .n{color:var(--muted)}

.miss-row .s{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  padding:1px 6px;
  border-radius:4px;
}

.miss-row .s.nf{
  color:var(--faint);
  background:var(--surface-2);
}

.miss-row .s.er{
  color:var(--err);
  background:var(--err-dim);
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal-bg.open{display:flex}

.modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  max-width:640px;
  width:100%;
  max-height:80vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}

.modal-head h3{
  margin:0;
  font-size:13.5px;
  font-weight:600;
}

.modal-head button{
  border:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
}

.modal-body{
  padding:14px 16px;
  overflow:auto;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--ok);
  white-space:pre-wrap;
  word-break:break-all;
  background:var(--surface-2);
}

.modal-foot{
  padding:10px 16px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
}

.modal-foot button{
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  border-radius:7px;
  padding:7px 14px;
  font-size:12.5px;
  cursor:pointer;
  font-family:inherit;
}

.api-error{
  border:1px solid var(--err);
  background:var(--err-dim);
  color:var(--err);
  border-radius:10px;
  padding:14px 16px;
  font-size:13px;
  line-height:1.5;
}

@media(max-width:600px){
  .header-row{padding:10px 0}

  .brand{gap:10px}

  .brand-logo{
    width:100px;
    height:100px;
  }

  .brand-text{gap:0}

  .brand .name{font-size:20px}

  .brand .tag{display:none}

  form{flex-direction:column}
}
</style>
</head>

<body>

<header>
  <div class="wrap header-row">

    <div class="brand">

      <img
        src="logo.png"
        class="brand-logo"
        alt="Argus OSINT logo"
      >

      <div class="brand-text">
        <span class="name">Argus OSINT</span>
        <span class="tag">public profile lookup</span>
      </div>

    </div>

    <button class="theme-btn" id="themeBtn">
      Light mode
    </button>

  </div>
</header>

<main class="wrap">

  <section class="search-card">

    <h1>Look up a handle</h1>

    <p class="sub">
      Search for publicly available profile information and explore matching accounts.
    </p>

    <form id="searchForm">

      <input
        type="text"
        id="usernameInput"
        placeholder="e.g. octocat"
        required
        autocomplete="off"
        maxlength="100"
      >

      <button type="submit" id="searchBtn">
        Check
      </button>

    </form>

    <div class="progress" id="progressContainer">

      <div class="progress-line">
        <span id="progressText">Preparing lookup…</span>
        <span id="progressPercent">0%</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>

    </div>

  </section>

  <div class="summary" id="summary">

    <span>
      <span class="dot" style="background:var(--ok)"></span>
      <b id="statFound">0</b> matched
    </span>

    <span>
      <span class="dot" style="background:var(--faint)"></span>
      <b id="statNotFound">0</b> no record
    </span>

    <span>
      <span class="dot" style="background:var(--err)"></span>
      <b id="statErrors">0</b> blocked / errored
    </span>

    <button class="copy-btn" id="copySummaryBtn">
      Copy results
    </button>

  </div>

  <section class="group" id="resultsSection">

    <div class="empty" id="emptyState">

      <b>No lookup run yet</b>

      Enter a handle above and press Check to search for public profiles.

    </div>

  </section>

</main>

<div class="modal-bg" id="jsonModal">

  <div class="modal">

    <div class="modal-head">

      <h3 id="modalTitle">Raw response</h3>

      <button id="closeModalBtn" aria-label="Close">
        ✕
      </button>

    </div>

    <div class="modal-body">
      <pre id="modalJsonContent" style="margin:0;"></pre>
    </div>

    <div class="modal-foot">
      <button id="copyModalJsonBtn">
        Copy JSON
      </button>
    </div>

  </div>

</div>

<script>

/* =========================================================
   ARGUS HYBRID LOOKUP
========================================================= */

const API_ENDPOINT = "/api/lookup";


/* =========================================================
   DIRECT BROWSER SOURCES
========================================================= */

const SOURCES = [

  {
    id:"pronouns_page",
    name:"Pronouns.page",
    category:"Identity",

    url:user =>
      `https://en.pronouns.page/api/public/v3/users/${encodeURIComponent(user)}`,

    parse:data => {

      if(!data || !data.profiles) return null;

      const en =
        data.profiles.en ||
        Object.values(data.profiles)[0];

      if(!en) return null;

      const names =
        (en.names || [])
          .map(n =>
            typeof n === "string"
              ? n
              : n.value || n.name
          )
          .filter(Boolean);

      const pronouns =
        (en.pronouns || [])
          .map(p =>
            typeof p === "string"
              ? p
              : p.value || p.pronoun
          )
          .filter(Boolean);

      return {
        avatar:data.avatar || null,
        title:names[0] || data.username,
        handle:`@${data.username}`,
        bio:en.bio || "",
        badges:pronouns,
        metrics:[
          {l:"Names",v:names.length},
          {l:"Pronouns",v:pronouns.length}
        ],
        links:(en.links || [])
          .map(l =>
            typeof l === "string"
              ? l
              : l.href || l.link
          )
          .filter(Boolean),
        profileUrl:`https://pronouns.page/@${data.username}`
      };
    }
  },


  {
    id:"chess_com",
    name:"Chess.com",
    category:"Gaming",

    url:user =>
      `https://api.chess.com/pub/player/${encodeURIComponent(user)}`,

    parse:async(profile,user) => {

      if(!profile || !profile.username) return null;

      const base =
        `https://api.chess.com/pub/player/${encodeURIComponent(user)}`;

      const [statsResult,clubsResult] =
        await Promise.allSettled([

          fetchDirect(`${base}/stats`),

          fetchDirect(`${base}/clubs`)

        ]);

      const stats =
        statsResult.status === "fulfilled"
          ? statsResult.value.data
          : null;

      const clubsData =
        clubsResult.status === "fulfilled"
          ? clubsResult.value.data
          : null;

      const clubs =
        Array.isArray(clubsData?.clubs)
          ? clubsData.clubs
          : [];

      return {

        avatar:profile.avatar || null,

        title:
          profile.name ||
          profile.username,

        handle:
          `@${profile.username}`,

        bio:
          `Joined ${
            profile.joined
              ? new Date(profile.joined * 1000).toLocaleDateString()
              : "—"
          } · last online ${
            profile.last_online
              ? new Date(profile.last_online * 1000).toLocaleDateString()
              : "—"
          }`,

        badges:[
          profile.title
            ? `Title: ${profile.title}`
            : null,
          profile.location
        ].filter(Boolean),

        metrics:[
          {
            l:"Blitz",
            v:stats?.chess_blitz?.last?.rating ?? "—"
          },
          {
            l:"Rapid",
            v:stats?.chess_rapid?.last?.rating ?? "—"
          },
          {
            l:"Bullet",
            v:stats?.chess_bullet?.last?.rating ?? "—"
          },
          {
            l:"Followers",
            v:profile.followers ?? "—"
          }
        ],

        clubs:
          clubs.slice(0,4).map(c => ({
            name:c.name,
            icon:c.icon,
            url:c.url
          })),

        links:
          profile.url
            ? [profile.url]
            : [],

        profileUrl:
          profile.url ||
          `https://www.chess.com/member/${profile.username}`

      };
    }
  },


  {
    id:"lichess",
    name:"Lichess",
    category:"Gaming",

    url:user =>
      `https://lichess.org/api/user/${encodeURIComponent(user)}`,

    parse:data => {

      if(!data || data.error || !data.id) return null;

      const perf=data.perfs || {};

      return {

        avatar:null,

        title:data.username,

        handle:
          data.title
            ? `[${data.title}] @${data.id}`
            : `@${data.id}`,

        bio:data.bio || "",

        badges:[
          data.online ? "Online" : "Offline",
          data.patron ? "Patron" : null
        ].filter(Boolean),

        metrics:[
          {l:"Blitz",v:perf.blitz?.rating ?? "—"},
          {l:"Rapid",v:perf.rapid?.rating ?? "—"},
          {l:"Puzzles",v:perf.puzzle?.rating ?? "—"},
          {l:"Games",v:data.count?.all ?? 0}
        ],

        links:data.url ? [data.url] : [],

        profileUrl:
          data.url ||
          `https://lichess.org/@/${data.username}`

      };
    }
  },


  {
    id:"github",

/* =========================================================
   HELPERS
========================================================= */

function esc(str){

  if(str === null || str === undefined){
    return "";
  }

  return String(str).replace(
    /[&<>'"]/g,
    t => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"
    }[t] || t)
  );
}


async function fetchDirect(url){

  const controller=new AbortController();

  const timeout=setTimeout(
    () => controller.abort(),
    7000
  );

  try{

    const response=await fetch(
      url,
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        },
        signal:controller.signal
      }
    );

    let data=null;

    try{
      data=await response.json();
    }catch{}

    return {
      ok:response.ok,
      status:response.status,
      data
    };

  }finally{

    clearTimeout(timeout);

  }
}


async function queryBrowserSource(source,username){

  try{

    const response=
      await fetchDirect(
        source.url(username)
      );

    if(response.status === 404 ||
       response.status === 410){

      return {
        id:source.id,
        name:source.name,
        category:source.category,
        status:"not_found",
        raw:response.data,
        parsed:null
      };

    }

    if(!response.ok){

      return {
        id:source.id,
        name:source.name,
        category:source.category,
        status:"error",
        raw:response.data,
        parsed:null,
        httpStatus:response.status,
        browserFailed:true
      };

    }

    let parsed=null;

    try{

      parsed=
        await source.parse(
          response.data,
          username
        );

    }catch{}

    if(parsed){

      return {
        id:source.id,
        name:source.name,
        category:source.category,
        status:"found",
        raw:response.data,
        parsed
      };

    }

    return {
      id:source.id,
      name:source.name,
      category:source.category,
      status:"not_found",
      raw:response.data,
      parsed:null
    };

  }catch(error){

    return {
      id:source.id,
      name:source.name,
      category:source.category,
      status:"error",
      raw:null,
      parsed:null,
      httpStatus:null,
      browserFailed:true,
      browserError:error?.message || "Browser request failed"
    };

  }

}


/* =========================================================
   SERVER FALLBACK
========================================================= */

async function queryServerFallback(username,sourceId){

  const url =
    `${API_ENDPOINT}?username=${
      encodeURIComponent(username)
    }&source=${
      encodeURIComponent(sourceId)
    }`;

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        }
      }
    );

  let payload=null;

  try{
    payload=await response.json();
  }catch{}

  if(!response.ok){

    throw new Error(
      payload?.error ||
      `Server fallback failed (${response.status})`
    );

  }

  if(
    !payload ||
    !Array.isArray(payload.results)
  ){

    throw new Error(
      "Invalid server response"
    );

  }

  return payload.results[0] || null;

}


/* =========================================================
   MAIN SEARCH
========================================================= */

searchForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const username=
      usernameInput.value.trim();

    if(!username) return;

    currentUsername=username;
    currentResults=[];

    resultsSection.innerHTML="";
    summary.classList.remove("active");

    searchBtn.disabled=true;
    usernameInput.disabled=true;

    progressContainer.classList.add("active");

    progressBar.style.width="5%";
    progressPercent.textContent="5%";
    progressText.textContent="Starting lookup…";

    try{

      /*
       * First attempt:
       * browser → public APIs
       */

      const directResults=
        await Promise.all(
          SOURCES.map(
            source =>
              queryBrowserSource(
                source,
                username
              )
          )
        );


      progressBar.style.width="55%";
      progressPercent.textContent="55%";
      progressText.textContent=
        "Checking blocked sources…";


      /*
       * Only use Vercel for sources where
       * the browser request failed.
       */

      const fallbackPromises=
        directResults.map(
          async (result,index) => {

            if(
              result.status !== "error" ||
              !result.browserFailed
            ){

              return result;

            }

            const source=SOURCES[index];

            try{

              const fallback=
                await queryServerFallback(
                  username,
                  source.id
                );

              if(fallback){
                return fallback;
              }

            }catch{}

            return result;

          }
        );


      currentResults=
        await Promise.all(
          fallbackPromises
        );


      progressBar.style.width="100%";
      progressPercent.textContent="100%";
      progressText.textContent="Search complete";


      const found=
        currentResults.filter(
          x => x.status==="found"
        ).length;

      const notFound=
        currentResults.filter(
          x => x.status==="not_found"
        ).length;

      const errors=
        currentResults.filter(
          x => x.status==="error"
        ).length;


      statFound.textContent=found;
      statNotFound.textContent=notFound;
      statErrors.textContent=errors;

      summary.classList.add("active");

      renderResults(username);


      setTimeout(
        () => {
          progressContainer.classList.remove("active");
        },
        400
      );


    }catch(error){

      progressBar.style.width="100%";
      progressPercent.textContent="100%";
      progressText.textContent="Lookup failed";

      progressContainer.classList.remove("active");

      resultsSection.innerHTML=`
        <div class="api-error">
          <b>Argus lookup error</b><br>
          ${esc(error?.message || "Unknown error")}
        </div>
      `;

      summary.classList.remove("active");

    }finally{

      searchBtn.disabled=false;
      usernameInput.disabled=false;

    }

  }
);


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(username){

  resultsSection.innerHTML="";

  const hits=
    currentResults.filter(
      result =>
        result.status==="found" &&
        result.parsed
    );

  const rest=
    currentResults.filter(
      result =>
        result.status!=="found" ||
        !result.parsed
    );


  if(hits.length){

    const title=
      document.createElement("p");

    title.className="group-title";

    title.textContent=
      `Matched on ${hits.length} source${
        hits.length===1 ? "" : "s"
      }`;

    const grid=
      document.createElement("div");

    grid.className="hits";

    hits.forEach(
      item =>
        grid.appendChild(
          buildCard(item)
        )
    );

    resultsSection.appendChild(title);
    resultsSection.appendChild(grid);

  }else{

    const none=
      document.createElement("div");

    none.className="empty";

    none.innerHTML=
      `<b>No public match for "${esc(username)}"</b>
       Checked ${currentResults.length} sources — nothing came back as a confirmed profile.`;

    resultsSection.appendChild(none);

  }


  if(rest.length){

    const details=
      document.createElement("details");

    details.className="misses";

    const summaryEl=
      document.createElement("summary");

    summaryEl.innerHTML=
      `<span>
        ${rest.length}
        source${rest.length===1 ? "" : "s"}
        with no record or a blocked request
       </span>
       <span class="chev">›</span>`;

    details.appendChild(summaryEl);


    rest.forEach(
      result => {

        const row=
          document.createElement("div");

        row.className="miss-row";

        const statusClass=
          result.status==="error"
            ? "er"
            : "nf";

        let statusText="no record";

        if(result.status==="error"){

          statusText=
            result.httpStatus
              ? `error ${result.httpStatus}`
              : "blocked / errored";

        }

        row.innerHTML=
          `<span class="n">
             ${esc(result.name || result.endpoint?.name)}
           </span>
           <span class="s ${statusClass}">
             ${esc(statusText)}
           </span>`;

        details.appendChild(row);

      }
    );

    resultsSection.appendChild(details);

  }

}


/* =========================================================
   CARD
========================================================= */

function buildCard(item){

  const p=item.parsed || {};

  const card=
    document.createElement("div");

  card.className="card";

  const firstLetter=
    String(
      p.title ||
      p.handle ||
      "?"
    ).charAt(0).toUpperCase();


  const head=
    document.createElement("div");

  head.className="card-head";


  const identity=
    document.createElement("div");

  identity.className="card-id";


  if(p.avatar){

    const img=
      document.createElement("img");

    img.className="avatar";
    img.src=p.avatar;
    img.alt="";
    img.loading="lazy";

    img.onerror=() => {

      const fallback=
        document.createElement("div");

      fallback.className="avatar-fallback";
      fallback.textContent=firstLetter;

      img.replaceWith(fallback);

    };

    identity.appendChild(img);

  }else{

    const fallback=
      document.createElement("div");

    fallback.className="avatar-fallback";
    fallback.textContent=firstLetter;

    identity.appendChild(fallback);

  }


  const src=
    document.createElement("div");

  src.className="card-src";

  src.innerHTML=
    `<div class="name">
       ${esc(item.name || item.endpoint?.name || "")}
     </div>
     <div class="cat">
       ${esc(item.category || item.endpoint?.category || "")}
     </div>`;

  identity.appendChild(src);


  const inspect=
    document.createElement("button");

  inspect.className="inspect-btn";
  inspect.title="View raw response";
  inspect.ariaLabel="View raw response";
  inspect.textContent="{ }";


  head.appendChild(identity);
  head.appendChild(inspect);


  card.appendChild(head);


  const title=
    document.createElement("div");

  title.className="card-title";
  title.textContent=p.title || "";

  card.appendChild(title);


  const handle=
    document.createElement("div");

  handle.className="card-handle";
  handle.textContent=p.handle || "";

  card.appendChild(handle);


  if(p.bio){

    const bio=
      document.createElement("div");

    bio.className="card-bio";
    bio.textContent=p.bio;

    card.appendChild(bio);

  }


  if(Array.isArray(p.badges) && p.badges.length){

    const badges=
      document.createElement("div");

    badges.className="badges";

    p.badges
      .filter(Boolean)
      .forEach(
        badge => {

          const el=
            document.createElement("span");

          el.className="badge";
          el.textContent=String(badge);

          badges.appendChild(el);

        }
      );

    card.appendChild(badges);

  }


  if(Array.isArray(p.metrics) && p.metrics.length){

    const metrics=
      document.createElement("div");

    metrics.className="metrics";

    p.metrics.forEach(
      metric => {

        const el=
          document.createElement("div");

        el.className="metric";

        el.innerHTML=
          `<div class="v">
             ${esc(metric.v ?? "—")}
           </div>
           <div class="l">
             ${esc(metric.l || "")}
           </div>`;

        metrics.appendChild(el);

      }
    );

    card.appendChild(metrics);

  }


  if(Array.isArray(p.clubs) && p.clubs.length){

    const clubs=
      document.createElement("div");

    clubs.className="clublist";

    p.clubs.forEach(
      club => {

        const a=
          document.createElement("a");

        a.href=club.url || "#";
        a.target="_blank";
        a.rel="noopener noreferrer";

        if(club.icon){

          const img=
            document.createElement("img");

          img.src=club.icon;
          img.alt="";
          img.loading="lazy";

          a.appendChild(img);

        }

        a.appendChild(
          document.createTextNode(
            club.name || "Club"
          )
        );

        clubs.appendChild(a);

      }
    );

    card.appendChild(clubs);

  }


  const foot=
    document.createElement("div");

  foot.className="card-foot";


  const id=
    document.createElement("span");

  id.className="id mono";
  id.textContent=
    item.id ||
    item.endpoint?.id ||
    "";

  foot.appendChild(id);


  if(p.profileUrl){

    const open=
      document.createElement("a");

    open.className="open";
    open.href=p.profileUrl;
    open.target="_blank";
    open.rel="noopener noreferrer";
    open.textContent="Open profile";

    foot.appendChild(open);

  }


  card.appendChild(foot);


  inspect.addEventListener(
    "click",
    () => {

      modalTitle.textContent=
        `${item.name || item.endpoint?.name || "Source"} — raw response`;

      rawModalJSON=
        item.raw || {
          status:"No payload"
        };

      modalJsonContent.textContent=
        JSON.stringify(
          rawModalJSON,
          null,
          2
        );

      jsonModal.classList.add("open");

    }
  );


  return card;

}


/* =========================================================
   COPY RESULTS
========================================================= */

copySummaryBtn.addEventListener(
  "click",
  async () => {

    const hits=
      currentResults.filter(
        result =>
          result.status==="found" &&
          result.parsed
      );

    if(!hits.length) return;


    let text=
      `Argus OSINT report — ${currentUsername}\n\n`;


    hits.forEach(
      item => {

        const p=item.parsed;

        text+=
          `${item.name || item.endpoint?.name} (${
            p.handle || ""
          })\n`;

        if(p.title)
          text+=`Name: ${p.title}\n`;

        if(p.bio)
          text+=`Bio: ${p.bio}\n`;

        if(
          Array.isArray(p.badges) &&
          p.badges.length
        )
          text+=
            `Badges: ${p.badges.join(", ")}\n`;

        if(
          Array.isArray(p.metrics)
        ){

          p.metrics.forEach(
            metric => {

              text+=
                `${metric.l}: ${metric.v}\n`;

            }
          );

        }

        if(p.profileUrl)
          text+=`URL: ${p.profileUrl}\n`;

        text+="\n";

      }
    );


    try{

      await navigator.clipboard.writeText(text);

      const old=
        copySummaryBtn.textContent;

      copySummaryBtn.textContent="Copied";

      setTimeout(
        () =>
          copySummaryBtn.textContent=old,
        1500
      );

    }catch{

      copySummaryBtn.textContent="Copy failed";

      setTimeout(
        () =>
          copySummaryBtn.textContent="Copy results",
        1500
      );

    }

  }
);

(function initTheme(){

  const prefersLight=
    window.matchMedia(
      "(prefers-color-scheme: light)"
    ).matches;

  const initial=
    prefersLight
      ? "light"
      : "dark";

  document.documentElement.setAttribute(
    "data-theme",
    initial
  );

  themeBtn.textContent=
    initial==="light"
      ? "Dark mode"
      : "Light mode";

})();


themeBtn.addEventListener(
  "click",
  () => {

    const current=
      document.documentElement.getAttribute(
        "data-theme"
      );

    const next=
      current==="light"
        ? "dark"
        : "light";

    document.documentElement.setAttribute(
      "data-theme",
      next
    );

    themeBtn.textContent=
      next==="light"
        ? "Dark mode"
        : "Light mode";

  }
);

</script>

</body>
  </html>
